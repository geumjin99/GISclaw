name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash desktop/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: pwsh desktop/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.exe

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: false
          body: |
            Desktop builds. macOS: open the .dmg and drag GISclaw to Applications; on first launch use right-click → Open, or on macOS 15 allow it under System Settings → Privacy & Security. Windows: run the installer; if SmartScreen appears, choose More info → Run anyway.
